[package]
name = "sentrydesk"
version = "1.1.2"
description = "安全情报本地聚合解析桌面工具（本地运行，数据不出机器）"
authors = ["SentryDesk"]
edition = "2024"

[lib]
name = "sentrydesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# 用 native-tls（Windows 走 SChannel），避免 ring 的 C 编译在静态 CRT 下失败
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "gzip", "brotli"] }
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
regex = "1"
thiserror = "2"
quick-xml = "0.38"
scraper = "0.24"
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.1"

[profile.dev]
# 关闭 debuginfo：cc-rs 在 /Z7 + 静态 CRT 下会触发 cl D8050，且本项目不需要调试符号
debug = 0
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
